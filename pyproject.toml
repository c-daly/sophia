[tool.poetry]
name = "sophia"
version = "0.1.0"
description = "Non-linguistic cognitive core for Project LOGOS"
authors = ["Project LOGOS Team"]
readme = "README.md"
license = "MIT"
keywords = ["cognitive-core", "knowledge-graph", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
packages = [
    {include = "sophia", from = "src"},
    {include = "logos_sophia_sdk", from = "src"},
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
pydantic = ">=2.0.0"
networkx = ">=3.0"
sqlalchemy = ">=2.0.0"
neo4j = ">=5.0.0"
pyshacl = ">=0.25.0"
tenacity = ">=8.0.0"
fastapi = ">=0.100.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
python-multipart = ">=0.0.6"
pillow = ">=10.0.0"
python-dateutil = ">=2.8.2"
pymilvus = ">=2.5.0"
urllib3 = "^2.5.0"
redis = ">=5.0.0"
pydantic-settings = ">=2.0.0"
# Pinned to specific tag for stability
# Also provides: logos_config, logos_test_utils, logos_tools, logos_hcg
logos-foundry = {git = "https://github.com/c-daly/logos.git", tag = "v0.4.2"}

[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
torch = ">=2.0.0,<3.0.0"
torchvision = ">=0.15.0,<1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
pytest-cov = ">=4.0.0"
pytest-timeout = ">=2.1.0"
black = ">=23.0.0"
ruff = ">=0.1.0"
mypy = ">=1.0.0"
httpx = ">=0.24.0"
pytest-asyncio = ">=0.21.0"
types-networkx = ">=2.6.0"
types-python-dateutil = ">=2.8.19.14"
types-requests = ">=2.31.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']
exclude = "src/logos_sophia_sdk"

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["src/logos_sophia_sdk"]

[tool.ruff.lint.per-file-ignores]
# app.py requires load_dotenv() before pydantic-settings imports
"src/sophia/api/app.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "logos_hcg.*",
    "logos_sophia_sdk.*",
]
ignore_errors = true
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=sophia --cov-report=term-missing --cov-fail-under=60"
markers = [
    "unit: marks tests as unit tests (no external services, fast)",
    "integration: marks tests as integration tests requiring live services (deselect with '-m \"not integration\"')",
    "e2e: marks tests as end-to-end tests requiring full stack and Sophia service (deselect with '-m \"not e2e\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring GPU hardware (deselect with '-m \"not gpu\"')",
    "requires_torch: marks tests requiring PyTorch to be installed (deselect with '-m \"not requires_torch\"')",
    "requires_weights: marks tests requiring V-JEPA checkpoint weights (deselect with '-m \"not requires_weights\"')",
]
