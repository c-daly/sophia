[tool.poetry]
name = "sophia"
version = "0.1.0"
description = "Non-linguistic cognitive core for Project LOGOS"
authors = ["Project LOGOS Team"]
readme = "README.md"
license = "MIT"
keywords = ["cognitive-core", "knowledge-graph", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
packages = [{include = "sophia", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
pydantic = ">=2.0.0"
networkx = ">=3.0"
sqlalchemy = ">=2.0.0"
neo4j = ">=5.0.0"
pyshacl = ">=0.25.0"
tenacity = ">=8.0.0"
fastapi = ">=0.100.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
python-multipart = ">=0.0.6"
logos-foundry = {path = "../logos", develop = true}
logos_sophia_sdk = {path = "../logos/sdk/python/sophia", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
pytest-cov = ">=4.0.0"
black = ">=23.0.0"
ruff = ">=0.1.0"
mypy = ">=1.0.0"
httpx = ">=0.24.0"
pytest-asyncio = ">=0.21.0"
types-networkx = ">=2.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=sophia --cov-report=term-missing"
markers = [
    "integration: marks tests as integration tests requiring live services (deselect with '-m \"not integration\"')",
]
