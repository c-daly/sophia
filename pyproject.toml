[tool.poetry]
name = "sophia"
version = "0.1.0"
description = "Non-linguistic cognitive core for Project LOGOS"
authors = ["Project LOGOS Team"]
readme = "README.md"
license = "MIT"
keywords = ["cognitive-core", "knowledge-graph", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
packages = [
    {include = "sophia", from = "src"},
    {include = "logos_sophia_sdk", from = "src"},
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
pydantic = ">=2.0.0"
networkx = ">=3.0"
sqlalchemy = ">=2.0.0"
neo4j = ">=5.0.0"
pyshacl = ">=0.25.0"
tenacity = ">=8.0.0"
fastapi = ">=0.100.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
python-multipart = ">=0.0.6"
pillow = ">=10.0.0"
python-dateutil = ">=2.8.2"
pymilvus = ">=2.5.0"
urllib3 = "^2.5.0"
logos-foundry = {git = "https://github.com/c-daly/logos.git", branch = "main"}

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
pytest-cov = ">=4.0.0"
pytest-timeout = ">=2.1.0"
black = ">=23.0.0"
ruff = ">=0.1.0"
mypy = ">=1.0.0"
httpx = ">=0.24.0"
pytest-asyncio = ">=0.21.0"
types-networkx = ">=2.6.0"
types-python-dateutil = ">=2.8.19.14"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']
exclude = "src/logos_sophia_sdk"

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["src/logos_sophia_sdk"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "logos_hcg.*",
    "logos_sophia_sdk.*",
]
ignore_errors = true
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=sophia --cov-report=term-missing"
markers = [
    "integration: marks tests as integration tests requiring live services (deselect with '-m \"not integration\"')",
]
