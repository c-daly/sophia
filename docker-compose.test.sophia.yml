services:
  test-runner:
    image: ghcr.io/c-daly/logos-foundry:0.1.0
    container_name: sophia-test-runner
    volumes:
      - ${SOPHIA_ROOT:-.}:/app/sophia:ro
    working_dir: /app/sophia
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4jtest
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      PYTHONPATH: /app:/app/sophia/src
    entrypoint: /bin/sh
    command: 
      - -c
      - |
        cd /app/sophia
        poetry install --no-root --only main
        pytest tests/ -m "not integration" -v --no-cov
    depends_on:
      neo4j:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks:
      - default
