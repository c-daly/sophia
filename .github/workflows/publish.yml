# Publish Sophia Container
# Uses the standardized reusable workflow from logos
# Part of c-daly/logos#431 - Standardize CI/CD across LOGOS repos

name: Publish Sophia Container

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'poetry.lock'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    uses: c-daly/logos/.github/workflows/reusable-publish.yml@ci/v2
    with:
      image_name: sophia
    secrets: inherit

  publish-ml:
    uses: c-daly/logos/.github/workflows/reusable-publish.yml@ci/v2
    with:
      image_name: sophia
      tag_override: ml-latest
      build_args: |
        SOPHIA_INSTALL_ML=1
    secrets: inherit
