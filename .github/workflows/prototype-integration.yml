name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (defaults to the workflow ref)"
        required: false
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [ main ]
    paths:
      - "tests/e2e/stack/**"
      - "scripts/run_integration_stack.sh"
      - "tests/integration/**"
      - ".github/workflows/prototype-integration.yml"

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run integration tests
        env:
          COMPOSE_CMD: docker compose
          HEALTH_TIMEOUT: "900"
          RUN_SOPHIA_INTEGRATION: "1"
          SOPHIA_REPO_ROOT: ${{ github.workspace }}
        run: ./scripts/run_integration_stack.sh

      - name: Collect docker logs
        if: failure()
        run: docker compose -f tests/e2e/stack/sophia/docker-compose.test.yml logs --tail=300 > integration.log

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: integration.log
          retention-days: 5
