name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
  schedule:
    # Run ML tests nightly at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      run_ml_tests:
        description: 'Install ML dependencies and run full test suite including GPU tests'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Standard CI: Full tests with real services (Neo4j, Milvus)
  # Skips ML tests that require PyTorch (marked with @pytest.mark.requires_torch)
  # Uses consistent 47xxx ports per LOGOS ecosystem standard (logos_config.SOPHIA_PORTS)
  # ---------------------------------------------------------------------------
  standard:
    uses: c-daly/logos/.github/workflows/reusable-standard-ci.yml@main
    with:
      python_versions: '["3.11","3.12"]'
      python_package_manager: 'poetry'
      python_command_prefix: 'poetry run '
      poetry_install_args: '--with dev'
      python_lint_paths: 'src tests'
      mypy_targets: 'src'
      # Start test services (Neo4j, Milvus, Sophia) using compose overlay
      docker_compose_file: 'containers/docker-compose.test.yml -f containers/docker-compose.test.sophia.yml'
      docker_compose_wait_script: |
        # Port values from logos_config.SOPHIA_PORTS (hardcoded here since Python isn't available yet)
        echo "Waiting for Neo4j..."
        timeout 60 bash -c 'until docker exec sophia-test-neo4j cypher-shell -u neo4j -p neo4jtest "RETURN 1" 2>/dev/null; do sleep 2; done'
        echo "Waiting for etcd..."
        timeout 60 bash -c 'until docker exec sophia-test-milvus-etcd etcdctl endpoint health 2>/dev/null; do sleep 2; done'
        echo "Waiting for MinIO..."
        timeout 60 bash -c 'until curl -f http://localhost:47900/minio/health/live 2>/dev/null; do sleep 2; done'
        echo "Waiting for Milvus..."
        timeout 120 bash -c 'until curl -f http://localhost:47091/healthz 2>/dev/null; do sleep 2; done'
        echo "Starting Sophia API from source..."
        poetry run uvicorn sophia.api.app:create_app --factory --host 0.0.0.0 --port 47000 --log-level info > /tmp/sophia-ci-api.log 2>&1 &
        SOPHIA_PID=$!
        echo "Sophia API started (PID: $SOPHIA_PID)"
        echo "Waiting for Sophia API..."
        timeout 120 bash -c 'until curl -f http://localhost:47000/health 2>/dev/null; do sleep 2; done'
        echo "All services ready!"
      pytest_env_script: |
        # Port values from logos_config.SOPHIA_PORTS
        export NEO4J_URI=bolt://localhost:47687
        export NEO4J_USER=neo4j
        export NEO4J_PASSWORD=neo4jtest
        export MILVUS_HOST=localhost
        export MILVUS_PORT=47530
        export SOPHIA_URL=http://localhost:47000
        export SOPHIA_API_TOKEN=test-token-for-sophia
        export RUN_SOPHIA_INTEGRATION=1
      # Run tests excluding ML-specific tests (requires_torch marker)
      # --cov-fail-under=50: Enforce 50% minimum coverage
      pytest_command: 'pytest tests/ -v --cov=sophia --cov-report=term --cov-report=xml --cov-fail-under=50 -m "not requires_torch" -r sS'
      coverage_python_version: '3.12'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Nightly ML Tests: Full test suite with PyTorch and ML dependencies
  # Runs on schedule or manual trigger with run_ml_tests=true
  # ---------------------------------------------------------------------------
  ml-tests:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_ml_tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
      
      - name: Install dependencies with ML extras
        run: poetry install --with dev,ml
      
      - name: Run ML tests
        run: |
          poetry run pytest tests/ -v -m "requires_torch" --tb=short
        env:
          JEPA_BACKEND: stub  # Use stub backend for CI (no GPU)
