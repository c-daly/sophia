name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
  schedule:
    # Run full integration tests weekly on Sunday at 4 AM UTC
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      run_integration:
        description: 'Run full integration tests with services'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Standard CI: Full tests with real services (Neo4j, Milvus)
  # Uses offset ports (47xxx, 49xxx) per LOGOS ecosystem standard (+40000 for sophia)
  # ---------------------------------------------------------------------------
  standard:
    uses: c-daly/logos/.github/workflows/reusable-standard-ci.yml@main
    with:
      python_versions: '["3.11","3.12"]'
      python_package_manager: 'poetry'
      python_command_prefix: 'poetry run '
      poetry_install_args: '--with dev'
      python_lint_paths: 'src tests'
      mypy_targets: 'src'
      # Start test services (Neo4j, Milvus, Sophia) using compose overlay
      docker_compose_file: 'docker-compose.test.yml -f docker-compose.test.sophia.yml'
      docker_compose_wait_script: |
        echo "Waiting for Neo4j..."
        timeout 60 bash -c 'until docker exec sophia-test-neo4j cypher-shell -u neo4j -p neo4jtest "RETURN 1" 2>/dev/null; do sleep 2; done'
        echo "Waiting for etcd..."
        timeout 60 bash -c 'until docker exec sophia-test-milvus-etcd etcdctl endpoint health 2>/dev/null; do sleep 2; done'
        echo "Waiting for MinIO..."
        timeout 60 bash -c 'until curl -f http://localhost:9000/minio/health/live 2>/dev/null; do sleep 2; done'
        echo "Waiting for Milvus..."
        timeout 120 bash -c 'until curl -f http://localhost:49091/healthz 2>/dev/null; do sleep 2; done'
        echo "Waiting for Sophia API..."
        timeout 120 bash -c 'until curl -f http://localhost:48001/health 2>/dev/null; do sleep 2; done'
        echo "All services ready!"
      pytest_env_script: |
        export NEO4J_URI=bolt://localhost:47687
        export NEO4J_USER=neo4j
        export NEO4J_PASSWORD=neo4jtest
        export MILVUS_HOST=localhost
        export MILVUS_PORT=59530
        export SOPHIA_URL=http://localhost:48001
        export SOPHIA_API_TOKEN=test-token-for-sophia
        export RUN_SOPHIA_INTEGRATION=1
      # Run ALL tests with services available
      # --cov-fail-under=60: Enforce 60% minimum coverage
      pytest_command: 'pytest tests/ -v --cov=sophia --cov-report=term --cov-report=xml --cov-fail-under=60 -r sS'
      coverage_python_version: '3.12'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
