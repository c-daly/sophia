version: '3.9'
networks:
  default:
    name: logos-test-network
    driver: bridge
volumes:
  sophia_test_neo4j_data: {}
  sophia_test_neo4j_logs: {}
  sophia_test_milvus_etcd: {}
  sophia_test_milvus_minio: {}
  sophia_test_milvus: {}
  sophia_test_media_storage: {}
services:
  sophia:
    container_name: sophia-test-api
    build:
      context: ../../../..
      dockerfile: Dockerfile
    ports:
    - 38001:8000
    environment:
    - NEO4J_URI=bolt://neo4j:7687
    - NEO4J_USER=neo4j
    - NEO4J_PASSWORD=neo4jtest
    - MILVUS_HOST=milvus
    - MILVUS_PORT=19530
    - SOPHIA_API_TOKEN=test-token-for-sophia
    - SEED_PICK_AND_PLACE_DATA=true
    - CLEAR_BEFORE_SEED=false
    - MEDIA_STORAGE_ROOT=/app/media_storage
    depends_on:
      neo4j:
        condition: service_healthy
      milvus:
        condition: service_healthy
    volumes:
    - sophia_test_media_storage:/app/media_storage
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/health
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
    - default
  neo4j:
    container_name: sophia-test-neo4j
    image: neo4j:5.14.0
    ports:
    - 37474:7474
    - 37687:7687
    environment:
    - NEO4J_AUTH=neo4j/neo4jtest
    - NEO4J_PLUGINS=["apoc","n10s"]
    - NEO4JLABS_PLUGINS=["apoc","n10s"]
    - NEO4J_dbms_security_procedures_unrestricted=apoc.*,n10s.*
    - NEO4J_dbms_security_procedures_allowlist=apoc.*,n10s.*
    - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
    volumes:
    - sophia_test_neo4j_data:/data
    - sophia_test_neo4j_logs:/logs
    healthcheck:
      test:
      - CMD
      - cypher-shell
      - -u
      - neo4j
      - -p
      - neo4jtest
      - RETURN 1
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - default
  milvus-etcd:
    container_name: sophia-test-milvus-etcd
    image: quay.io/coreos/etcd:v3.5.15
    environment:
    - ETCD_AUTO_COMPACTION_MODE=revision
    - ETCD_AUTO_COMPACTION_RETENTION=1000
    - ETCD_QUOTA_BACKEND_BYTES=4294967296
    - ETCD_SNAPSHOT_COUNT=50000
    command:
    - etcd
    - -advertise-client-urls=http://127.0.0.1:2379
    - -listen-client-urls
    - http://0.0.0.0:2379
    - --data-dir
    - /etcd
    volumes:
    - sophia_test_milvus_etcd:/etcd
    networks:
    - default
  milvus-minio:
    container_name: sophia-test-milvus-minio
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    environment:
    - MINIO_ROOT_USER=minioadmin
    - MINIO_ROOT_PASSWORD=minioadmin
    command:
    - minio
    - server
    - /minio_data
    - --console-address
    - :9001
    volumes:
    - sophia_test_milvus_minio:/minio_data
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 30s
      timeout: 20s
      retries: 3
    ports:
    - 9000:9000
    - 9001:9001
    networks:
    - default
  milvus:
    container_name: sophia-test-milvus
    image: milvusdb/milvus:v2.4.15
    command:
    - milvus
    - run
    - standalone
    environment:
    - ETCD_ENDPOINTS=milvus-etcd:2379
    - MINIO_ADDRESS=milvus-minio:9000
    depends_on:
    - milvus-etcd
    - milvus-minio
    volumes:
    - sophia_test_milvus:/var/lib/milvus
    ports:
    - 39530:19530
    - 39091:9091
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9091/healthz
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
    - default
